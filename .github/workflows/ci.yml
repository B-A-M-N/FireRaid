name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # FR-P1-12: test the EXACT supported minimum, not just "some modern Node".
    # engines.node is >=22.13.0 (node:sqlite in the test harness); the floor
    # MUST pass, alongside the latest 22.x — so a claim of support can never
    # drift from what CI actually verifies again.
    strategy:
      matrix:
        node-version: ["22.13.0", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # The unit directory includes two Chromium-backed parity/vision suites.
      # Install only the browser they require; the full browser matrix below
      # installs Chromium, Firefox, and WebKit for the wider E2E tier.
      - name: Install Chromium for browser-backed unit checks
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: node ./node_modules/eslint/bin/eslint.js "src/**/*.ts" "harness/**/*.ts" "tests/**/*.ts" "demo/**/*.ts" "scripts/**/*.mjs" --max-warnings 0

      - name: Unit tests
        run: npm run test:unit

      - name: Product boundary + origin budget + ledger proof
        run: |
          npm run test:product
          npm run test:origin-budget
          npm run test:ledger-proof

      # P0-AUDIT-3 (P0-4 regression gate): the Worker bootstrap must refuse
      # occupied ports, propagate suite exit codes, and never leak workerd.
      - name: Test-worker isolation (port/process identity)
        run: npm run test:worker-isolation

      # Note: the browser/e2e tier (workerd / Playwright) is too heavy for
      # the lightweight gate above and runs as a separate job. The e2e suite
      # is the human/keyboard/autofill arm of the deterministic gate
      # (rereview item 30); a11y runs via `npm run test:a11y`.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Worker integration suite (workerd)
        run: npm run test:integration
      # P0-AUDIT-3 (P0-5): release-critical gates — stateless production
      # envelope issuance / first-write materialization / forged-envelope
      # rejection (envelope suite) and the D1/resource budgets incl. the
      # verified-canary cost path (budget harness, server-derived treatment).
      - name: Production envelope suite (workerd, LAB_MODE=false)
        run: npm run test:envelope
      - name: D1 / resource budget harness (incl. verified canary)
        run: npm run test:budget
      - name: Human / keyboard / autofill E2E (Playwright, 3 browsers)
        run: npm run test:e2e:ci
      # P1 (P0-AUDIT-3): the production-plane tier — LAB_MODE=false in real
      # browsers (no lab banner, no presentation signatures, human flows
      # work, zero causal evidence on clean submissions). Runs only the
      # production spec against a hermetic production-test worker.
      - name: Production-plane E2E (Playwright, 3 browsers, LAB_MODE=false)
        run: npx playwright install chromium firefox webkit && npx playwright test --config=playwright.production.config.ts
      - name: Accessibility (axe)
        run: npm run test:a11y

  # P1-15: the published-package contract is its own CI job, not an
  # afterthought inside a wider gate — an exports map that points at files
  # that do not exist (or a dist build that fails) must fail the pipeline
  # even when every source-level gate is green. Runs the SAME smoke the
  # release gate runs: build → pack → install the tarball into an empty
  # temp project → import every declared subpath → functional round-trip.
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Package contract (build → pack → install → import → round-trip)
        run: npm run test:package
